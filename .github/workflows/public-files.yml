name: public-files

# This repository is public and holds downloads, not code. Fail any change that
# adds a file other than the ones named here: the README, the licenses, this
# check, and the Claude Code plugin with its marketplace listing.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  only-distribution-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse anything but distribution files
        run: |
          set -euo pipefail
          allowed='^(README\.md|LICENSE(-[A-Z-]+)?|\.gitattributes|\.github/workflows/public-files\.yml|\.claude-plugin/marketplace\.json|claude-plugin/(LICENSE|README\.md|\.mcp\.json|bin/find-cli|\.claude-plugin/(plugin\.json|icon\.png)|skills/[A-Za-z0-9/_-]+\.(md|html)))$'
          extra="$(git ls-files | grep -Ev "$allowed" || true)"
          if [[ -n "$extra" ]]; then
            echo "These files may not be published here:" >&2
            echo "$extra" >&2
            exit 1
          fi
          # Archives of a tag hold the README and licenses only.
          archived="$(git archive HEAD | tar -t | grep -Ev '^(README\.md|LICENSE(-[A-Z-]+)?|pax_global_header)$' || true)"
          if [[ -n "$archived" ]]; then
            echo "These files would be in a release's Source code archive:" >&2
            echo "$archived" >&2
            exit 1
          fi
